name: Deploy to GitHub Pages
# The site is index.html + data/ only (encyclopedia/ and source_texts/ are for readers of the repo). data/**/*.json and
# *.txt are deployed gzipped as <file>.gz and inflated in the browser, which keeps the site under Pages' 1 GB limit.
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data
      - name: Build the site
        run: |
          mkdir _site
          cp index.html bad.html LICENSE LICENSE-CONTENT NOTICE README.md _site/
          cp -r data _site/data
          find _site/data -type f \( -name '*.json' -o -name '*.txt' \) -print0 | xargs -0 -r -P"$(nproc)" -n500 gzip -6
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
